# Cargo.toml

[package]
name = "kuma_agent"
version = "4.6.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
log = "0.4"
fern = "0.6"
log-panics = "2.1"
tray-icon = "0.20"
tao = "0.31"
wry = "0.47"
serde_json = "1.0"
winreg = "0.52"
regex = "1"

[build-dependencies]
winres = "0.1"